<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🌙 动态壁纸 · 星空下的少女</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   🌙 星空下的少女 —— 动态壁纸（夜景版）
     和咖啡厅那版同一套引擎，但**所有光源/粒子都按这张图的真实位置调**：
       左下路灯 ~3%,88%   右侧路灯 ~89%,82%   红礼盒 ~57%,75%
       女孩脸 ~38%,25%    樱树 ~88%,70%
     层级：
       0  底色（深夜蓝）
       1  主画面（可呼吸 + 视差倾斜 + 湍流扭曲）
       2  星星闪烁层（只在天空区域，92 颗，各自节奏）
       3  路灯暖光（两盏，圆形光晕脉动）
       4  礼盒微光（粉色心血光）
       5  粒子（萤火/花瓣/雪/星尘）
       6  地平线远处微光
       7  前景暗角
       8  UI
     ══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#03040c}
body{font-family:"Comic Sans MS","Yuanti SC","Microsoft YaHei",system-ui,sans-serif;cursor:crosshair}

/* ── 0 底色 ── */
#base{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(80,50,120,.35), transparent 70%),
    linear-gradient(180deg,#03040c 0%,#070a1e 40%,#0d0a20 100%);
}

/* ── 1 主画面 ── */
#stage{
  position:fixed;inset:0;z-index:3;
  display:flex;align-items:center;justify-content:center;
  perspective:1400px;pointer-events:none;
}
#art{
  position:relative;
  width:100vw;height:56.25vw;         /* 16:9 */
  max-height:100vh;max-width:177.78vh;/* 两头都撑满 */
  transform-style:preserve-3d;will-change:transform;
  animation:breathe 7s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{ filter:brightness(.98) saturate(1.05); }
  50%    { filter:brightness(1.06) saturate(1.14); }
}
#art img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
  filter:url(#f-wave);
}

/* ── 2 星星闪烁（只在天空区域）── */
#stars{position:absolute;left:0;top:0;width:100%;height:62%;pointer-events:none;overflow:hidden}
.tw{
  position:absolute;border-radius:50%;background:#fff;
  box-shadow:0 0 6px rgba(200,225,255,.95), 0 0 14px rgba(150,190,255,.7);
  animation:twinkle ease-in-out infinite;
  will-change:transform,opacity;
}
@keyframes twinkle{
  0%,100%{ transform:scale(.55); opacity:.28; }
  45%    { transform:scale(1.35); opacity:1; }
  55%    { transform:scale(1.15); opacity:.9; }
}
/* 大星星带十字光芒 */
.tw.big::before,.tw.big::after{
  content:"";position:absolute;left:50%;top:50%;background:linear-gradient(90deg,transparent,rgba(220,235,255,.9),transparent);
  transform:translate(-50%,-50%);
}
.tw.big::before{ width:26px;height:1.5px; }
.tw.big::after{ width:1.5px;height:26px;background:linear-gradient(180deg,transparent,rgba(220,235,255,.9),transparent); }

/* 流星 */
#shoot{position:fixed;inset:0;z-index:14;pointer-events:none;overflow:hidden}
.meteor{
  position:absolute;height:2px;border-radius:2px;
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(210,235,255,.95));
  filter:drop-shadow(0 0 6px rgba(180,215,255,.9));
  animation:meteorFly linear forwards;
  will-change:transform,opacity;
}
@keyframes meteorFly{
  0%  { transform:translate3d(0,0,0) rotate(22deg); opacity:0; }
  10% { opacity:1; }
  100%{ transform:translate3d(-70vw,42vh,0) rotate(22deg); opacity:0; }
}

/* ── 3 路灯暖光 ── */
.lamp{
  position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle, rgba(255,214,140,.55) 0%, rgba(255,180,80,.28) 35%, rgba(255,160,60,0) 72%);
  filter:blur(10px);
  animation:lampPulse ease-in-out infinite;
}
@keyframes lampPulse{
  0%,100%{ transform:scale(1);    opacity:.72; }
  50%    { transform:scale(1.13); opacity:1; }
}

/* ── 4 礼盒微光 ── */
#giftGlow{
  position:absolute;left:57%;top:75%;width:26%;height:22%;
  margin-left:-13%;margin-top:-11%;
  border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle, rgba(255,120,150,.42) 0%, rgba(255,80,120,.18) 40%, rgba(255,60,100,0) 74%);
  filter:blur(14px);
  animation:giftPulse 3.4s ease-in-out infinite;
}
@keyframes giftPulse{
  0%,100%{ transform:scale(.92); opacity:.55; }
  50%    { transform:scale(1.12); opacity:.95; }
}

/* ── 6 远处地平线微光 ── */
#horizon{
  position:absolute;left:0;right:0;bottom:0;height:38%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(0deg, rgba(255,170,90,.16) 0%, rgba(255,150,80,.06) 40%, transparent 100%);
  animation:horizonGlow 9s ease-in-out infinite;
}
@keyframes horizonGlow{ 0%,100%{opacity:.65} 50%{opacity:1} }

/* ── 5 粒子 ── */
#pc{position:fixed;inset:0;z-index:12;pointer-events:none}

/* ── 7 暗角 ── */
#vig{
  position:fixed;inset:0;z-index:18;pointer-events:none;
  background:radial-gradient(ellipse 78% 72% at 50% 46%, transparent 42%, rgba(4,4,14,.62) 88%, rgba(2,2,8,.9) 100%);
}

/* ── 闪光 / 撒花 ── */
#flash{
  position:fixed;inset:0;z-index:22;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 40%, rgba(230,240,255,.9), rgba(180,210,255,.35) 42%, transparent 72%);
}
#flash.go{ animation:flashPop .9s ease-out; }
@keyframes flashPop{
  0%{opacity:0;transform:scale(.7)} 8%{opacity:.9;transform:scale(1.04)} 100%{opacity:0;transform:scale(1.3)}
}

/* ── 8 UI ── */
#clock{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:30;
  text-align:center;pointer-events:none;color:#eaf2ff;
  text-shadow:0 2px 8px rgba(0,0,0,.85), 0 0 22px rgba(140,190,255,.5);
}
#clock .t{font-size:clamp(26px,5.6vmin,50px);font-weight:900;letter-spacing:4px;line-height:1}
#clock .d{font-size:clamp(10px,1.7vmin,13px);letter-spacing:3px;opacity:.78;margin-top:6px}
#brand{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:30;
  text-align:center;pointer-events:none;color:#eaf2ff;text-shadow:0 2px 8px rgba(0,0,0,.85);
}
#brand .a{font-size:clamp(14px,2.4vmin,20px);font-weight:900;letter-spacing:8px}
#brand .b{font-size:clamp(10px,1.4vmin,12px);letter-spacing:4px;opacity:.6;margin-top:5px}
#hud{
  position:fixed;top:14px;left:14px;z-index:30;font-size:11.5px;line-height:1.7;
  color:rgba(230,240,255,.72);text-shadow:0 1px 3px rgba(0,0,0,.9);
  background:rgba(6,8,20,.5);border:1px solid rgba(160,190,255,.18);
  border-radius:10px;padding:8px 12px;backdrop-filter:blur(6px);
}
#hud b{color:#a8d0ff}
#modes{
  position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:31;
  display:flex;gap:7px;flex-wrap:wrap;justify-content:center;opacity:.3;transition:opacity .3s;
}
#modes:hover{opacity:1}
#modes button{
  font-family:inherit;font-size:12px;font-weight:bold;padding:6px 13px;border-radius:18px;cursor:pointer;
  border:1.5px solid rgba(160,190,255,.35);background:rgba(8,12,26,.6);color:#dce8ff;
  backdrop-filter:blur(6px);transition:background .2s,transform .1s;
}
#modes button:hover{background:rgba(110,160,255,.32);transform:translateY(-2px)}
#modes button.on{background:rgba(110,160,255,.55);border-color:#a8d0ff}
@media (max-width:600px){ #hud{display:none} }
</style>
</head>
<body>

<!-- SVG 湍流扭曲 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="f-wave" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="3" seed="11" result="n1">
        <animate attributeName="baseFrequency" dur="30s"
                 values="0.006 0.011;0.012 0.006;0.006 0.011" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n1" scale="4.5" xChannelSelector="R" yChannelSelector="G" result="d1"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23" result="n2">
        <animate attributeName="seed" dur="4.2s" values="1;50;1" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="d1" in2="n2" scale="1.6" xChannelSelector="R" yChannelSelector="B" result="d2"/>
      <feGaussianBlur in="d2" stdDeviation="1.4" result="glow"/>
      <feBlend in="d2" in2="glow" mode="screen"/>
    </filter>
  </defs>
</svg>

<div id="base"></div>

<!-- 主画面 -->
<div id="stage">
  <div id="art">
    <img src="images/night_clean.png" alt="星空下的少女">
    <div id="stars"></div>
    <div class="lamp" style="left:3%;top:88%;width:22%;height:22%;margin-left:-11%;margin-top:-11%;animation-duration:5.2s"></div>
    <div class="lamp" style="left:89%;top:82%;width:16%;height:16%;margin-left:-8%;margin-top:-8%;animation-duration:4.1s;animation-delay:-1.3s"></div>
    <div id="giftGlow"></div>
    <div id="horizon"></div>
  </div>
</div>

<div id="shoot"></div>
<canvas id="pc"></canvas>
<div id="vig"></div>
<div id="flash"></div>

<div id="clock"><div class="t" id="ctime">--:--</div><div class="d" id="cdate">----</div></div>
<div id="brand">
  <div class="a">STARRY NIGHT</div>
  <div class="b">星 空 下 的 少 女 · 动 态 壁 纸</div>
</div>
<div id="hud">
  帧率 <b id="hfps">--</b> FPS　·　粒子 <b id="hc">0</b>　·　星星 <b id="hs">0</b><br>
  鼠标移动 → 视差　·　点一下 → 撒花<br>
  <b>1</b> 深夜蓝　<b>2</b> 暖星　<b>3</b> 樱雪　<b>4</b> 极光　<b>空格</b> 流星雨
</div>
<div id="modes">
  <button data-m="night" class="on">1 深夜蓝</button>
  <button data-m="warm">2 暖星</button>
  <button data-m="sakura">3 樱雪</button>
  <button data-m="aurora">4 极光</button>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   🌙 星空壁纸引擎
     · 星星：92 颗，各自节奏闪烁，只在天空区域（上方 62%）
     · 流星：随机划过
     · 视差倾斜：鼠标 / 陀螺仪
     · 粒子：萤火虫 / 花瓣 / 雪 / 星尘（按模式换）
     · 冲击闪光 + 点击撒花 + 四种色调
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  const $ = (s) => document.querySelector(s);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ─────────── ① 星星 ─────────── */
  function buildStars() {
    const box = $("#stars");
    box.innerHTML = "";
    const n = window.innerWidth < 700 ? 55 : 92;
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      const big = Math.random() < 0.18;
      const s = big ? rnd(3, 5) : rnd(1, 2.6);
      d.className = "tw" + (big ? " big" : "");
      d.style.width = d.style.height = s + "px";
      // 只在"天空"里撒：避开中间偏左的女孩（那里 x 25~58%, y 8~60%）
      let x, y, tries = 0;
      do {
        x = rnd(1, 99);
        y = rnd(1, 96);
        tries++;
      } while (tries < 20 && x > 24 && x < 60 && y > 6 && y < 62);
      d.style.left = x + "%";
      d.style.top = y + "%";
      d.style.animationDuration = rnd(1.6, 4.6).toFixed(2) + "s";
      d.style.animationDelay = (-rnd(0, 5)).toFixed(2) + "s";
      d.style.opacity = rnd(.4, 1);
      box.appendChild(d);
    }
    $("#hs").textContent = n;
  }

  /* ─────────── ② 流星 ─────────── */
  function meteor(big) {
    const box = $("#shoot");
    const n = big ? 7 : 1;
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        const d = document.createElement("div");
        d.className = "meteor";
        const w = rnd(90, 240);
        d.style.width = w + "px";
        d.style.left = rnd(35, 105) + "%";
        d.style.top = rnd(-5, 40) + "%";
        d.style.animationDuration = rnd(1.1, 2.1).toFixed(2) + "s";
        box.appendChild(d);
        setTimeout(() => d.remove(), 2400);
      }, i * rnd(120, 380));
    }
  }
  setInterval(() => { if (Math.random() < 0.5) meteor(false); }, 5200);

  /* ─────────── ③ 视差倾斜 ─────────── */
  let mx = 0, my = 0, smx = 0, smy = 0;
  window.addEventListener("mousemove", (e) => {
    mx = (e.clientX / window.innerWidth - .5) * 2;
    my = (e.clientY / window.innerHeight - .5) * 2;
  });
  window.addEventListener("mouseleave", () => { mx = 0; my = 0; });
  window.addEventListener("deviceorientation", (e) => {
    if (e.gamma === null) return;
    mx = clamp(e.gamma / 30, -1, 1);
    my = clamp((e.beta - 45) / 40, -1, 1);
  });

  /* ─────────── ④ Canvas 粒子 ─────────── */
  const cv = $("#pc"), g2 = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  let MODE = "night";

  const PALETTE = {
    night:  { hue: [200, 215, 190, 45],  kinds: ["fire", "dust", "dust", "snow"] },
    warm:   { hue: [35, 45, 20, 340],    kinds: ["fire", "fire", "dust", "petal"] },
    sakura: { hue: [330, 345, 300, 200], kinds: ["petal", "petal", "dust", "snow"] },
    aurora: { hue: [160, 190, 280, 210], kinds: ["fire", "dust", "dust", "snow"] },
  };

  const P = [];
  function spawn(init, kind) {
    const pal = PALETTE[MODE] || PALETTE.night;
    const k = kind || pal.kinds[Math.floor(rnd(0, pal.kinds.length))];
    return {
      k: k,
      x: rnd(-40, W + 40),
      y: init ? rnd(0, H) : -30,
      vx: rnd(-17, 17),
      vy: k === "fire" ? rnd(-26, -6) : (k === "snow" ? rnd(10, 34) : rnd(6, 26)),
      r: k === "petal" ? rnd(6, 13) : (k === "fire" ? rnd(2.5, 5.5) : rnd(1.2, 3.4)),
      a: rnd(.35, .95),
      rot: rnd(0, 6.28), vr: rnd(-1.4, 1.4),
      hue: pal.hue[Math.floor(rnd(0, pal.hue.length))],
      ph: rnd(0, 6.28), age: 0, life: rnd(9, 22),
    };
  }
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", () => { resize(); buildStars(); });

  function initParticles() {
    P.length = 0;
    const n = W < 700 ? 60 : 130;
    for (let i = 0; i < n; i++) P.push(spawn(true));
  }

  function draw(dt) {
    const s = dt / 1000;
    g2.clearRect(0, 0, W, H);
    g2.globalCompositeOperation = "lighter";
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      p.age += s;
      p.x += (p.vx + Math.sin(p.ph + p.age * 1.7) * 14) * s;
      p.y += p.vy * s;
      p.rot += p.vr * s;
      const fin = clamp(p.age / 1.4, 0, 1), fout = clamp((p.life - p.age) / 2.4, 0, 1);
      const a = p.a * fin * fout;

      if (p.k === "fire") {
        // 萤火虫：核心 + 光晕 + 呼吸
        const pulse = .55 + .45 * Math.sin(p.age * 3.4 + p.ph);
        const rr = p.r * (1 + pulse * .7);
        const gr = g2.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr * 6);
        gr.addColorStop(0, "rgba(255,255,240," + (a * pulse) + ")");
        gr.addColorStop(.25, "hsla(" + p.hue + ",100%,72%," + (a * pulse * .6) + ")");
        gr.addColorStop(1, "hsla(" + p.hue + ",100%,60%,0)");
        g2.fillStyle = gr;
        g2.beginPath(); g2.arc(p.x, p.y, rr * 6, 0, 6.2832); g2.fill();
        g2.fillStyle = "rgba(255,255,255," + (a * pulse) + ")";
        g2.beginPath(); g2.arc(p.x, p.y, rr * .7, 0, 6.2832); g2.fill();
      } else if (p.k === "dust") {
        g2.fillStyle = "hsla(" + p.hue + ",90%,88%," + (a * .8) + ")";
        g2.beginPath(); g2.arc(p.x, p.y, p.r, 0, 6.2832); g2.fill();
      } else if (p.k === "snow") {
        const gr = g2.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
        gr.addColorStop(0, "rgba(255,255,255," + (a * .95) + ")");
        gr.addColorStop(1, "rgba(220,235,255,0)");
        g2.fillStyle = gr;
        g2.beginPath(); g2.arc(p.x, p.y, p.r * 3, 0, 6.2832); g2.fill();
      } else { // petal
        g2.save(); g2.translate(p.x, p.y); g2.rotate(p.rot);
        const gr = g2.createLinearGradient(-p.r, 0, p.r, 0);
        gr.addColorStop(0, "hsla(" + p.hue + ",100%,90%," + a + ")");
        gr.addColorStop(1, "hsla(" + p.hue + ",85%,72%," + (a * .55) + ")");
        g2.fillStyle = gr;
        g2.beginPath(); g2.ellipse(0, 0, p.r * 1.4, p.r * .75, 0, 0, 6.2832); g2.fill();
        g2.restore();
      }

      if (p.y < -80 || p.y > H + 80 || p.x < -140 || p.x > W + 140 || p.age > p.life) {
        P[i] = spawn(false);
        P[i].x = rnd(-60, W + 60);
      }
    }
    g2.globalCompositeOperation = "source-over";
  }

  /* ─────────── ⑤ 主循环 ─────────── */
  const art = $("#art");
  let t0 = performance.now(), ph = 0;
  function frame(now) {
    const dt = Math.min(50, now - t0); t0 = now; ph += dt * 0.00004;
    smx += (mx - smx) * 0.055;
    smy += (my - smy) * 0.055;

    const z = 1.045 + Math.sin(ph) * 0.03;
    const tx = smx * 30 + Math.sin(ph * .5) * 12;
    const ty = smy * 22 + Math.cos(ph * .38) * 8;
    art.style.transform =
      "translate3d(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px,0) " +
      "scale(" + z.toFixed(4) + ") " +
      "rotateX(" + (-smy * 3.2).toFixed(2) + "deg) rotateY(" + (smx * 4.5).toFixed(2) + "deg)";

    draw(dt);
    requestAnimationFrame(frame);
  }

  /* ─────────── ⑥ 冲击 / 撒花 ─────────── */
  let lastShock = 0;
  function shock(force) {
    const now = performance.now();
    if (now - lastShock < 400) return;
    lastShock = now;
    const f = $("#flash");
    f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
    if (force) meteor(true);
    for (let i = 0; i < (force ? 30 : 12); i++) {
      const p = spawn(false, "fire");
      p.x = rnd(0, W); p.y = rnd(H * .3, H); p.life = rnd(2, 4); p.age = 0; p.a = rnd(.7, 1);
      P.push(p);
    }
  }
  setInterval(() => { if (Math.random() < .45) shock(false); }, 9000);

  const EMOJI = ["✨", "⭐", "🌟", "💫", "🌙", "❄", "🌸", "💗", "🎁", "🫧"];
  const st2 = document.createElement("style");
  st2.textContent = "@keyframes confFly{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));opacity:0}}";
  document.head.appendChild(st2);
  function burst(x, y, n) {
    for (let i = 0; i < (n || 18); i++) {
      const d = document.createElement("div");
      d.textContent = EMOJI[Math.floor(rnd(0, EMOJI.length))];
      const ang = rnd(0, 6.2832), dist = rnd(80, 300);
      d.style.cssText = "position:fixed;pointer-events:none;z-index:26;left:" + x + "px;top:" + y + "px;" +
        "font-size:" + rnd(14, 32).toFixed(0) + "px;" +
        "--dx:" + (Math.cos(ang) * dist).toFixed(0) + "px;" +
        "--dy:" + (Math.sin(ang) * dist - 60).toFixed(0) + "px;" +
        "--rot:" + rnd(-400, 400).toFixed(0) + "deg;" +
        "animation:confFly " + rnd(.9, 1.6).toFixed(2) + "s cubic-bezier(.15,.7,.3,1) forwards;";
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 1800);
    }
  }
  window.addEventListener("pointerdown", (e) => { burst(e.clientX, e.clientY, 18); shock(false); });

  /* ─────────── ⑦ 模式 ─────────── */
  const MODES = {
    night:  { base:"linear-gradient(180deg,#03040c 0%,#070a1e 40%,#0d0a20 100%)", amb:"brightness(1) saturate(1.06)" },
    warm:   { base:"linear-gradient(180deg,#100a06 0%,#1c1208 40%,#241708 100%)", amb:"brightness(1.05) saturate(1.22) sepia(.14)" },
    sakura: { base:"linear-gradient(180deg,#12061a 0%,#22102e 40%,#2c1430 100%)", amb:"brightness(1.03) saturate(1.18) hue-rotate(-12deg)" },
    aurora: { base:"linear-gradient(180deg,#02100e 0%,#06201e 40%,#08262a 100%)", amb:"brightness(1.04) saturate(1.26) hue-rotate(24deg)" },
  };
  function applyMode(m) {
    MODE = MODES[m] ? m : "night";
    const c = MODES[MODE];
    $("#base").style.background =
      "radial-gradient(ellipse 80% 60% at 50% 100%, rgba(80,50,120,.35), transparent 70%)," + c.base;
    $("#art img").style.filter = "url(#f-wave) " + c.amb;
    // 粒子按新模式重生
    for (let i = 0; i < P.length; i++) P[i] = spawn(true);
    document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.m === MODE));
  }
  document.querySelectorAll("#modes button").forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); applyMode(b.dataset.m); };
  });
  const KEYS = { "1": "night", "2": "warm", "3": "sakura", "4": "aurora" };
  window.addEventListener("keydown", (e) => {
    if (KEYS[e.key]) applyMode(KEYS[e.key]);
    if (e.code === "Space") { e.preventDefault(); shock(true); burst(rnd(W * .3, W * .7), rnd(H * .3, H * .6), 26); }
  });

  /* ─────────── ⑧ 时钟 / HUD ─────────── */
  function clock() {
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    $("#ctime").textContent = p(d.getHours()) + ":" + p(d.getMinutes());
    const wd = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
    $("#cdate").textContent = (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 · 周" + wd;
  }
  clock(); setInterval(clock, 10000);

  let fa = 0, fn = 0, ft = performance.now();
  (function hud() {
    const now = performance.now();
    fa += 1000 / Math.max(1, now - ft); fn++; ft = now;
    if (fn >= 20) { $("#hfps").textContent = Math.round(fa / fn); $("#hc").textContent = P.length; fa = 0; fn = 0; }
    setTimeout(hud, 250);
  })();

  /* ─────────── 启动 ─────────── */
  resize(); buildStars(); initParticles(); applyMode("night");
  requestAnimationFrame(frame);
  setTimeout(() => shock(true), 500);
})();
</script>
</body>
</html>
